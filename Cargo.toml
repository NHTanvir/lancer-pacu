[package]
name = "lancer-pacu"
version = "0.1.0"
edition = "2021"
description = "Rust clone of pacu — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-pacu"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# REPL
rustyline = "14"
inventory = "0.3"

# AWS SDK
aws-config = "1.8"
aws-sdk-sts = "1.85"
aws-sdk-iam = "1.109"
aws-credential-types = "1"

# Output
colored = "2"
comfy-table = "7"

# Week 2 (session DB):
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "json", "chrono"] }
dirs = "5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
