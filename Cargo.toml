[package]
name = "lancer-pacu"
version = "0.1.0"
edition = "2021"
description = "Rust clone of pacu — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-pacu"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# REPL
rustyline = "14"
inventory = "0.3"

# AWS SDK
aws-config = "1.8"
aws-sdk-sts = "1.85"
aws-sdk-iam = "1.109"
aws-sdk-ec2 = "1.150"
aws-sdk-s3 = "1.133"
aws-sdk-lambda = "1.100"
aws-sdk-eventbridge = "1.85"
aws-sdk-cloudtrail = "1.90"
aws-sdk-guardduty = "1.85"
aws-sdk-cloudwatch = "1.85"
aws-sdk-organizations = "1.85"
aws-sdk-sns = "1.85"
aws-sdk-rds = "1.110"
aws-sdk-secretsmanager = "1.85"
aws-sdk-ssm = "1.85"
aws-smithy-types = "1"
aws-credential-types = "1"

# Output
colored = "2"
comfy-table = "7"

# Week 2 (session DB):
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "json", "chrono"] }
dirs = "5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
zip = "2"
chrono = "0.4"

# SOCKS proxy support (storage layer; full SDK integration deferred — see src/commands/proxy.rs)
tokio-socks = "0.5"

# IMDSv2 credential fetching
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = 3
# Use thin LTO instead of full LTO to avoid OOM on machines with limited RAM
# when compiling many large AWS SDK crates simultaneously.
lto = "thin"
codegen-units = 4
strip = true
